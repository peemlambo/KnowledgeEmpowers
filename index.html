<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnowledgeEmpowers Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F2B; --maroon-dark:#5C1620;
    --pink:#F4DDE2; --pink-mid:#EAC5CD;
    --ink:#2A2626; --ink-soft:#6B6660;
    --paper:#FAF7F5; --card:#FFFFFF; --rule:#E4DAD6;
    --ok:#3F7A54; --err:#B23A3A;
    --sans:'Inter',-apple-system,sans-serif;
    --display:'Archivo',var(--sans);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .hidden{display:none !important;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:400px;background:var(--card);border-radius:14px;padding:36px 32px;box-shadow:0 16px 40px rgba(90,20,30,0.10);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .name{font-family:var(--display);font-weight:800;font-size:19px;color:var(--maroon-dark);}
  .login-sub{font-size:13px;color:var(--ink-soft);margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;background:var(--paper);}
  .field input:focus, .field select:focus{outline:2px solid var(--maroon);outline-offset:1px;border-color:var(--maroon);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13.5px;}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--maroon);border:1px solid var(--rule);}
  .btn-ghost:hover{background:var(--pink);}
  .btn-block{width:100%;padding:11px;}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-danger{background:transparent;color:var(--err);border:1px solid #ECD3D3;}
  .btn-danger:hover{background:#FBEDED;}
  .banner{font-size:12.5px;border-radius:6px;padding:9px 11px;margin-bottom:14px;}
  .banner-err{color:var(--err);background:#FBEDED;}
  .banner-ok{color:var(--ok);background:#EAF4EC;}
  .banner-info{color:var(--maroon-dark);background:var(--pink);}
  .login-hint{margin-top:20px;font-size:11.5px;color:var(--ink-soft);line-height:1.55;background:#F4F1EE;border-radius:8px;padding:10px 12px;}

  #app-screen{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:20px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--rule);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .topbar .brand{margin-right:auto;}
  .topbar .brand .name{font-size:16px;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .tab{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);border:none;background:transparent;}
  .tab:hover{background:var(--pink);color:var(--maroon-dark);}
  .tab.active{background:var(--maroon);color:#fff;}
  .who{display:flex;align-items:center;gap:10px;}
  .who .role-tag{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--pink);color:var(--maroon-dark);padding:3px 9px;border-radius:20px;}
  .who .name{font-size:13px;color:var(--ink-soft);}

  .content{flex:1;padding:26px;max-width:980px;width:100%;margin:0 auto;box-sizing:border-box;}
  .page-title{font-size:24px;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--rule);}
  .stat-card .num{font-family:var(--display);font-size:30px;font-weight:800;color:var(--maroon);}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin-bottom:20px;}
  .panel h4{font-size:14px;margin-bottom:14px;}
  .form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end;}
  .form-actions{margin-top:12px;display:flex;justify-content:flex-end;align-items:center;gap:10px;}

  .item-list{display:flex;flex-direction:column;gap:10px;}
  .item{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .item .main{flex:1;min-width:200px;}
  .item .title{font-weight:600;font-size:14.5px;margin-bottom:3px;}
  .item .meta{font-size:12px;color:var(--ink-soft);}
  .item .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .empty{font-size:13px;color:var(--ink-soft);padding:20px 0;text-align:center;}
  .loading{font-size:13px;color:var(--ink-soft);padding:20px 0;text-align:center;}

  .reach{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px 3px 6px;border-radius:20px;white-space:nowrap;}
  .reach .dot{width:7px;height:7px;border-radius:50%;}
  .reach.reach-all{background:#F0EEEC;color:var(--ink-soft);}
  .reach.reach-all .dot{background:var(--ink-soft);}
  .reach.reach-grade{background:var(--pink);color:var(--maroon-dark);}
  .reach.reach-grade .dot{background:var(--maroon);}
  .reach.reach-student{background:var(--maroon);color:#fff;}
  .reach.reach-student .dot{background:#fff;}
  .book-tag{font-size:11px;font-weight:700;color:var(--maroon-dark);background:var(--pink);border-radius:6px;padding:2px 7px;}
  .status-tag{font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;}
  .status-enrolled{background:#EAF4EC;color:var(--ok);}
  .status-inactive{background:#F0EEEC;color:var(--ink-soft);}

  .day-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .day-tab{padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);}
  .day-tab.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}
  table.sched{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.sched th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--rule);}
  table.sched td{padding:9px 10px;border-bottom:1px solid var(--rule);}

  .roster-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .roster-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .roster-head h4{font-size:15px;}
  .roster-count{font-size:11.5px;color:var(--ink-soft);}
  .student-row{display:grid;grid-template-columns:1.1fr 1fr 1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:13px;}
  .student-row input{padding:7px 9px;border:1px solid var(--rule);border-radius:7px;font-size:12.5px;}
  .add-student-row{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:8px;margin-top:12px;}

  @media (max-width:640px){
    .topbar{padding:10px 14px;}
    .content{padding:16px;}
    .item{flex-direction:column;}
    .student-row, .add-student-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand"><div class="name">KnowledgeEmpowers</div></div>
    <p class="login-sub">Sign in to your homework, resources and schedule.</p>
    <div id="loginBanner" class="banner hidden"></div>
    <div class="field"><label for="loginUsername">Username</label><input id="loginUsername" type="text" autocomplete="username"></div>
    <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">Log in</button>
    <div class="login-hint" id="loginHint">
      Accounts are provisioned by your teacher — there's no self-signup. If you don't have a login yet, ask your teacher to add you from the Classes tab.
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-screen" class="hidden">
  <div class="topbar">
    <div class="brand"><div class="name">KnowledgeEmpowers</div></div>
    <div class="tabs" id="tabs"></div>
    <div class="who">
      <span class="role-tag" id="whoRole"></span>
      <span class="name" id="whoName"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
/* ---------------------------------------------------------------
   BACKEND
   All data lives in a Google Sheet; this file only talks to the
   Apps Script Web App below. Paste your deployed Web App URL here
   — see apps-script-setup.md for the exact script and sheet layout.
--------------------------------------------------------------- */
const API_URL = "https://script.google.com/macros/s/AKfycbyzYx5Bo5jw6eZst6Mpxs22m66dWZjsdTqcttDn2_07sWXssw76q3MKvRxCnxk0RJ9Giw/exec";

const GRADES = ['Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10'];
const BOOKS = [
  ['A1','Whole Number Arithmetic Mastery'],['A2','Place Value, Factors & Multiples'],
  ['A3','Integers & Order of Operations'],['A4','Sequences & Patterns'],
  ['B1','Fractions Mastery'],['B2','Decimals Mastery'],['B3','Percentages Mastery'],
  ['C1','Rate, Ratio & Proportion'],
  ['D1','Algebra Foundations & Manipulation'],['D2','Equations & Inequalities'],
  ['E1','Geometry'],['E2','Measurement'],['E3','Transformations & Coordinate Geometry'],
  ['F1','Functions & Graphs'],
  ['G1','Statistics'],['G2','Probability'],
  ['H1','Financial Maths']
];

function slug(g){ return g.toLowerCase().replace(/\s+/g,''); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isConfigured(){ return API_URL && API_URL.indexOf('PASTE_YOUR') !== 0; }

/* ---- API helpers ---- */
async function apiGet(action, params){
  const q = new URLSearchParams({ action, ...(params||{}) });
  const res = await fetch(API_URL + '?' + q.toString());
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify({ action, ...(payload||{}) })
  });
  return res.json();
}

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
let session = null;      // {id, name, role, grade}
let data = null;         // {roster, homework, resources, schedule, announcements}
let activeTab = 'overview';
let activeDay = 'Mon';

/* ---------------------------------------------------------------
   LOGIN
--------------------------------------------------------------- */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

if(!isConfigured()){
  const hint = document.getElementById('loginHint');
  hint.innerHTML = 'This portal isn\u2019t connected to a Google Sheet yet. See <code>apps-script-setup.md</code> to deploy the Apps Script backend, then paste the Web App URL into <code>API_URL</code> at the top of this file\u2019s script.';
  document.getElementById('loginBtn').disabled = true;
}

async function doLogin(){
  const banner = document.getElementById('loginBanner');
  banner.classList.add('hidden');
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value;
  if(!u || !p) return;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in\u2026';
  try{
    const res = await apiGet('login', { username: u, password: p });
    if(!res.ok){
      banner.textContent = res.error || 'Incorrect username or password.';
      banner.className = 'banner banner-err';
      return;
    }
    session = res.user;
    const dataRes = await apiGet('data');
    if(!dataRes.ok){
      banner.textContent = dataRes.error || 'Signed in, but couldn\u2019t load the portal\u2019s data. Try again.';
      banner.className = 'banner banner-err';
      return;
    }
    data = normalizeData(dataRes);
    activeTab = 'overview';
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    renderShell();
  }catch(err){
    banner.textContent = 'Couldn\u2019t reach the portal\u2019s Google Sheet. Check your connection and try again.';
    banner.className = 'banner banner-err';
  }finally{
    btn.disabled = false; btn.textContent = 'Log in';
  }
}

function normalizeData(res){
  const schedule = {}; ['Mon','Tue','Wed','Thu','Fri'].forEach(d => schedule[d] = []);
  (res.schedule||[]).forEach(row => { if(schedule[row.Day]) schedule[row.Day].push(row); });
  return {
    roster: res.roster || [],
    homework: res.homework || [],
    resources: res.resources || [],
    schedule,
    announcements: res.announcements || []
  };
}

async function refreshData(){
  const res = await apiGet('data');
  if(res.ok){ data = normalizeData(res); }
  return res.ok;
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  session = null; data = null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
});

/* ---------------------------------------------------------------
   VISIBILITY
--------------------------------------------------------------- */
function visibleTo(assignedTo, user){
  if(user.role === 'teacher') return true;
  if(!assignedTo || assignedTo === 'All Grades') return true;
  if(assignedTo === user.grade) return true;
  if(assignedTo === user.username) return true;
  return false;
}
function reachInfo(assignedTo){
  if(!assignedTo || assignedTo === 'All Grades') return { cls:'reach-all', label:'All Grades' };
  if(GRADES.includes(assignedTo)) return { cls:'reach-grade', label:assignedTo };
  const u = data.roster.find(x => x.username === assignedTo);
  return { cls:'reach-student', label: u ? (u.name + ' only') : 'Individual' };
}

/* ---------------------------------------------------------------
   SHELL / NAV
--------------------------------------------------------------- */
function renderShell(){
  const isTeacher = session.role === 'teacher';
  document.getElementById('whoRole').textContent = isTeacher ? 'Teacher' : session.grade;
  document.getElementById('whoName').textContent = session.name;

  const tabDefs = [
    ['overview','Overview'], ['homework','Homework'], ['resources','Resources'],
    ['schedule','Schedule'], ['announcements','Announcements']
  ];
  if(isTeacher) tabDefs.push(['classes','Classes']);

  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  tabDefs.forEach(([id,label]) => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab===id ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', () => { activeTab = id; renderShell(); });
    tabsEl.appendChild(b);
  });
  renderContent();
}

function renderContent(){
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(activeTab==='overview') renderOverview(c);
  else if(activeTab==='homework') renderCollection(c, 'homework', 'Homework', true);
  else if(activeTab==='resources') renderCollection(c, 'resources', 'Resources', true);
  else if(activeTab==='schedule') renderSchedule(c);
  else if(activeTab==='announcements') renderAnnouncements(c);
  else if(activeTab==='classes' && session.role==='teacher') renderClasses(c);
}

/* ---------------------------------------------------------------
   Assign-To selector: All Grades / a whole Grade / one learner.
   Only ENROLLED students appear here — the roster the server sends
   already excludes anyone whose Status isn't "Enrolled".
--------------------------------------------------------------- */
function assignToSelectHTML(id){
  let html = `<select id="${id}"><option value="All Grades">All Grades</option>`;
  html += `<optgroup label="Whole grade">`;
  GRADES.forEach(g => { html += `<option value="${g}">${g}</option>`; });
  html += `</optgroup>`;
  GRADES.forEach(g => {
    const students = data.roster.filter(u => u.role==='student' && u.grade===g);
    if(!students.length) return;
    html += `<optgroup label="${g} \u2014 individual learner">`;
    students.forEach(s => { html += `<option value="${s.username}">${s.name}</option>`; });
    html += `</optgroup>`;
  });
  html += `</select>`;
  return html;
}
function bookSelectHTML(id){
  let html = `<select id="${id}"><option value="">No GROW book tag</option>`;
  BOOKS.forEach(([code,title]) => { html += `<option value="${code} \u00b7 ${title}">${code} \u00b7 ${title}</option>`; });
  html += `</select>`;
  return html;
}

/* ---------------------------------------------------------------
   OVERVIEW
--------------------------------------------------------------- */
function renderOverview(c){
  const hw = data.homework.filter(i => visibleTo(i.AssignedTo, session));
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  const todayName = days[new Date().getDay()-1] || null;
  const todaySched = todayName ? data.schedule[todayName].filter(i => visibleTo(i.AssignedTo, session)) : [];
  const ann = data.announcements.filter(i => visibleTo(i.AssignedTo, session));

  c.innerHTML = `
    <h2 class="page-title">Overview</h2>
    <p class="page-sub">${session.role==='teacher' ? 'Everything posted across all grades and learners.' : `Welcome back, ${escapeHtml(session.name)}.`}</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${hw.length}</div><div class="label">Homework items</div></div>
      <div class="stat-card"><div class="num">${todaySched.length}</div><div class="label">${todayName ? todayName+"'s classes" : 'No school today'}</div></div>
      <div class="stat-card"><div class="num">${ann.length}</div><div class="label">Announcements</div></div>
    </div>
    <div class="panel"><h4>Recent announcements</h4><div class="item-list" id="ov-ann"></div></div>
  `;
  const wrap = c.querySelector('#ov-ann');
  const recent = [...ann].sort((a,b)=>(b.Timestamp||0)-(a.Timestamp||0)).slice(0,3);
  if(!recent.length){ wrap.innerHTML = '<div class="empty">Nothing posted yet.</div>'; }
  else recent.forEach(a => wrap.appendChild(itemRow(a, 'Announcements')));
}

/* ---------------------------------------------------------------
   HOMEWORK / RESOURCES (shared renderer)
--------------------------------------------------------------- */
function renderCollection(c, key, label, isHomework){
  const isTeacher = session.role === 'teacher';
  const sheetName = label; // 'Homework' or 'Resources'
  const items = [...data[key]].filter(i => visibleTo(i.AssignedTo, session)).sort((a,b)=>(b.Timestamp||0)-(a.Timestamp||0));

  c.innerHTML = `
    <h2 class="page-title">${label}</h2>
    <p class="page-sub">${isTeacher ? 'Post to all grades, one grade, or one specific learner.' : 'Showing everything assigned to you.'}</p>
    ${isTeacher ? `
    <div class="panel">
      <h4>Post new ${isHomework ? 'homework' : 'resource'}</h4>
      <div class="form-grid">
        <div class="field"><label>Title</label><input id="fTitle" type="text"></div>
        <div class="field"><label>Subject / topic</label><input id="fSubject" type="text" placeholder="e.g. Fractions"></div>
        ${isHomework ? `<div class="field"><label>Due</label><input id="fDue" type="text" placeholder="e.g. Fri 22 Aug"></div>` : ''}
        <div class="field"><label>Assign to</label>${assignToSelectHTML('fAssignTo')}</div>
        <div class="field"><label>GROW book (optional)</label>${bookSelectHTML('fBook')}</div>
        <div class="field"><label>Link (optional)</label><input id="fLink" type="text" placeholder="Google Drive / doc link"></div>
      </div>
      <div class="form-actions"><span id="fStatus" class="banner hidden" style="margin:0;"></span><button class="btn btn-primary" id="fSubmit">Post</button></div>
    </div>` : ''}
    <div class="item-list" id="collList"></div>
  `;

  if(isTeacher){
    c.querySelector('#fSubmit').addEventListener('click', async () => {
      const title = c.querySelector('#fTitle').value.trim();
      if(!title) return;
      const btn = c.querySelector('#fSubmit');
      const status = c.querySelector('#fStatus');
      btn.disabled = true; btn.textContent = 'Posting\u2026';
      const row = {
        Title: title,
        Subject: c.querySelector('#fSubject').value.trim() || 'General',
        AssignedTo: c.querySelector('#fAssignTo').value,
        Book: c.querySelector('#fBook').value,
        Link: c.querySelector('#fLink').value.trim(),
        Timestamp: Date.now()
      };
      if(isHomework) row.Due = c.querySelector('#fDue').value.trim() || 'TBD';
      const res = await apiPost('append', { sheet: sheetName, row });
      btn.disabled = false; btn.textContent = 'Post';
      if(!res.ok){
        status.textContent = res.error || 'Could not post — try again.';
        status.className = 'banner banner-err';
        return;
      }
      await refreshData();
      renderContent();
    });
  }

  const list = c.querySelector('#collList');
  if(!items.length){ list.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  items.forEach(i => list.appendChild(itemRow(i, sheetName)));
}

function itemRow(item, sheetName){
  const row = document.createElement('div');
  row.className = 'item';
  const reach = reachInfo(item.AssignedTo);
  const bookHTML = item.Book ? `<span class="book-tag">${escapeHtml(item.Book.split(' \u00b7 ')[0])}</span>` : '';
  const linkHTML = item.Link ? `<a href="${escapeHtml(item.Link)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--maroon);font-weight:600;">Open link</a>` : '';
  const dueHTML = item.Due ? ` \u00b7 Due ${escapeHtml(item.Due)}` : '';
  row.innerHTML = `
    <div class="main">
      <div class="title">${escapeHtml(item.Title)} ${bookHTML}</div>
      <div class="meta">${escapeHtml(item.Subject || item.Body || '')}${dueHTML}</div>
    </div>
    <div class="side">
      <span class="reach ${reach.cls}"><span class="dot"></span>${reach.label}</span>
      ${linkHTML}
      ${session.role==='teacher' ? `<button class="btn btn-danger btn-sm" data-del>Delete</button>` : ''}
    </div>
  `;
  if(session.role==='teacher'){
    row.querySelector('[data-del]')?.addEventListener('click', async () => {
      await apiPost('delete', { sheet: sheetName, id: item.ID });
      await refreshData();
      renderContent();
    });
  }
  return row;
}

/* ---------------------------------------------------------------
   SCHEDULE — grade-level only; a timetable slot is inherently a
   class-wide thing.
--------------------------------------------------------------- */
function renderSchedule(c){
  const isTeacher = session.role === 'teacher';
  const days = ['Mon','Tue','Wed','Thu','Fri'];

  c.innerHTML = `
    <h2 class="page-title">Schedule</h2>
    <p class="page-sub">Weekly class timetable.</p>
    ${isTeacher ? `
    <div class="panel">
      <h4>Add class to schedule</h4>
      <div class="form-grid">
        <div class="field"><label>Day</label><select id="sDay">${days.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
        <div class="field"><label>Time</label><input id="sTime" type="text" placeholder="2:00\u20132:50"></div>
        <div class="field"><label>Subject</label><input id="sSubject" type="text"></div>
        <div class="field"><label>Teacher</label><input id="sTeacher" type="text"></div>
        <div class="field"><label>Assign to</label><select id="sAssignTo"><option value="All Grades">All Grades</option>${GRADES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" id="sSubmit">Add</button></div>
    </div>` : ''}
    <div class="day-tabs" id="dayTabs"></div>
    <div id="schedTable"></div>
  `;

  const dayTabsEl = c.querySelector('#dayTabs');
  days.forEach(d => {
    const b = document.createElement('button');
    b.className = 'day-tab' + (activeDay===d ? ' active' : '');
    b.textContent = d;
    b.addEventListener('click', () => { activeDay = d; renderContent(); });
    dayTabsEl.appendChild(b);
  });

  if(isTeacher){
    c.querySelector('#sSubmit').addEventListener('click', async () => {
      const subject = c.querySelector('#sSubject').value.trim();
      const time = c.querySelector('#sTime').value.trim();
      if(!subject || !time) return;
      const day = c.querySelector('#sDay').value;
      const row = { Day: day, Time: time, Subject: subject, Teacher: c.querySelector('#sTeacher').value.trim() || 'TBD', AssignedTo: c.querySelector('#sAssignTo').value };
      await apiPost('append', { sheet: 'Schedule', row });
      await refreshData();
      activeDay = day;
      renderContent();
    });
  }

  const items = (data.schedule[activeDay] || []).filter(i => visibleTo(i.AssignedTo, session));
  const tableWrap = c.querySelector('#schedTable');
  if(!items.length){ tableWrap.innerHTML = '<div class="empty">Nothing scheduled for this day yet.</div>'; return; }
  let rows = items.map(i => `
    <tr>
      <td>${escapeHtml(i.Time)}</td><td>${escapeHtml(i.Subject)}</td><td>${escapeHtml(i.Teacher)}</td>
      <td><span class="reach ${reachInfo(i.AssignedTo).cls}"><span class="dot"></span>${reachInfo(i.AssignedTo).label}</span></td>
      <td>${session.role==='teacher' ? `<button class="btn btn-danger btn-sm" data-sdel="${i.ID}">Delete</button>` : ''}</td>
    </tr>
  `).join('');
  tableWrap.innerHTML = `<table class="sched"><thead><tr><th>Time</th><th>Subject</th><th>Teacher</th><th>Assigned</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  if(session.role==='teacher'){
    tableWrap.querySelectorAll('[data-sdel]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await apiPost('delete', { sheet: 'Schedule', id: btn.getAttribute('data-sdel') });
        await refreshData();
        renderContent();
      });
    });
  }
}

/* ---------------------------------------------------------------
   ANNOUNCEMENTS
--------------------------------------------------------------- */
function renderAnnouncements(c){
  const isTeacher = session.role === 'teacher';
  c.innerHTML = `
    <h2 class="page-title">Announcements</h2>
    <p class="page-sub">Notices for all grades, one grade, or one learner.</p>
    ${isTeacher ? `
    <div class="panel">
      <h4>Post announcement</h4>
      <div class="form-grid">
        <div class="field"><label>Title</label><input id="aTitle" type="text"></div>
        <div class="field"><label>Message</label><input id="aBody" type="text"></div>
        <div class="field"><label>Assign to</label>${assignToSelectHTML('aAssignTo')}</div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" id="aSubmit">Post</button></div>
    </div>` : ''}
    <div class="item-list" id="annList"></div>
  `;
  if(isTeacher){
    c.querySelector('#aSubmit').addEventListener('click', async () => {
      const title = c.querySelector('#aTitle').value.trim();
      if(!title) return;
      const row = { Title: title, Body: c.querySelector('#aBody').value.trim(), AssignedTo: c.querySelector('#aAssignTo').value, Timestamp: Date.now() };
      await apiPost('append', { sheet: 'Announcements', row });
      await refreshData();
      renderContent();
    });
  }
  const list = c.querySelector('#annList');
  const items = [...data.announcements].filter(i => visibleTo(i.AssignedTo, session)).sort((a,b)=>(b.Timestamp||0)-(a.Timestamp||0));
  if(!items.length){ list.innerHTML = '<div class="empty">No announcements yet.</div>'; return; }
  items.forEach(i => list.appendChild(itemRow(i, 'Announcements')));
}

/* ---------------------------------------------------------------
   CLASSES — enrollment lives here. Adding a row here is what
   "enrolls" a learner; toggling Status to Inactive revokes their
   login without deleting their history. There is no self-signup
   anywhere in this app — only a teacher can create an account.
--------------------------------------------------------------- */
function renderClasses(c){
  c.innerHTML = `
    <h2 class="page-title">Classes</h2>
    <p class="page-sub">Every learner here has their own login. Only accounts marked <strong>Enrolled</strong> can sign in — set a learner to Inactive to revoke access without losing their record.</p>
    <div id="rosterWrap"></div>
  `;
  const wrap = c.querySelector('#rosterWrap');
  GRADES.forEach(g => {
    const students = data.roster.filter(u => u.role==='student' && u.grade===g);
    const card = document.createElement('div');
    card.className = 'roster-card';
    card.innerHTML = `
      <div class="roster-head"><h4>${g}</h4><span class="roster-count">${students.length} enrolled</span></div>
      <div id="rows-${slug(g)}"></div>
      <div class="add-student-row">
        <input id="newName-${slug(g)}" placeholder="Full name">
        <input id="newUser-${slug(g)}" placeholder="Username">
        <input id="newPass-${slug(g)}" placeholder="Password">
        <button class="btn btn-ghost btn-sm" data-addstudent="${g}">Enroll learner</button>
      </div>
    `;
    wrap.appendChild(card);
    const rowsEl = card.querySelector(`#rows-${slug(g)}`);
    students.forEach(s => {
      const row = document.createElement('div');
      row.className = 'student-row';
      const isEnrolled = s.status !== 'Inactive';
      row.innerHTML = `
        <div>${escapeHtml(s.name)}</div>
        <input value="${escapeHtml(s.username)}" data-username>
        <input value="" placeholder="New password" data-password>
        <span class="status-tag ${isEnrolled?'status-enrolled':'status-inactive'}">${isEnrolled?'Enrolled':'Inactive'}</span>
        <button class="btn btn-ghost btn-sm" data-save>Save</button>
        <button class="btn ${isEnrolled?'btn-danger':'btn-ghost'} btn-sm" data-toggle>${isEnrolled?'Deactivate':'Reactivate'}</button>
      `;
      rowsEl.appendChild(row);
      row.querySelector('[data-save]').addEventListener('click', async () => {
        const uname = row.querySelector('[data-username]').value.trim();
        const pass = row.querySelector('[data-password]').value;
        const fields = {};
        if(uname) fields.Username = uname;
        if(pass) fields.Password = pass;
        if(!Object.keys(fields).length) return;
        await apiPost('update', { sheet: 'Users', id: s.id, fields });
        await refreshData();
        renderContent();
      });
      row.querySelector('[data-toggle]').addEventListener('click', async () => {
        await apiPost('update', { sheet: 'Users', id: s.id, fields: { Status: isEnrolled ? 'Inactive' : 'Enrolled' } });
        await refreshData();
        renderContent();
      });
    });
    card.querySelector('[data-addstudent]').addEventListener('click', async () => {
      const name = card.querySelector(`#newName-${slug(g)}`).value.trim();
      const uname = card.querySelector(`#newUser-${slug(g)}`).value.trim();
      const pass = card.querySelector(`#newPass-${slug(g)}`).value;
      if(!name || !uname || !pass) return;
      if(data.roster.some(x => x.username === uname)){ alert('That username is already taken.'); return; }
      await apiPost('append', { sheet: 'Users', row: { Name:name, Username:uname, Password:pass, Role:'student', Grade:g, Status:'Enrolled' } });
      await refreshData();
      renderContent();
    });
  });
}
</script>
